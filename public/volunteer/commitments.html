<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commitments — Volunteer Portal — PENZO</title>
  <script>
    const savedTheme = localStorage.getItem('penzo-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/themes.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <div class="container">
      <a href="/volunteer/dashboard.html" class="brand-logo"><span>PENZO</span></a>
      <div class="header-actions">
        <span class="badge badge--teal">Volunteer</span>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle theme"><span class="theme-icon">🌙</span></button>
        <button id="logout-btn" class="btn btn--outline btn--sm">Sign Out</button>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <nav class="sidebar" aria-label="Volunteer Navigation">
      <ul class="sidebar-nav">
        <li><a href="/volunteer/dashboard.html" class="sidebar-link">Dashboard</a></li>
        <li><a href="/volunteer/examinations.html" class="sidebar-link">Browse Examinations</a></li>
        <li><a href="/volunteer/interests.html" class="sidebar-link">My Interests</a></li>
        <li><a href="/volunteer/commitments.html" class="sidebar-link active" aria-current="page">Commitments</a></li>
        <li><a href="/volunteer/profile.html" class="sidebar-link">My Profile</a></li>
      </ul>
      <div class="sidebar-footer">
        <span id="user-name" style="font-size: 0.85rem; font-weight: 600; color: var(--color-text);">Volunteer</span>
      </div>
    </nav>

    <main id="main-content" class="main-content">
      <div style="margin-bottom: 2rem;">
        <h1>Confirmed Commitments</h1>
        <p>Your confirmed scribe arrangements and matched examination sessions.</p>
      </div>

      <div class="card">
        <div class="card-body">
          <ul id="commitments-list" style="list-style: none; display: flex; flex-direction: column; gap: 1.25rem;">
            <li>Loading commitments...</li>
          </ul>

          <div id="commitments-empty" class="empty-state" hidden>
            <p>No confirmed commitments at this time.</p>
          </div>
        </div>
      </div>

      <div id="pagination" style="margin-top: 1.5rem;"></div>
    </main>
  </div>

  <script type="module" src="/js/volunteer/commitments.js"></script>
</body>
</html>
